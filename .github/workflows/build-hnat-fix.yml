name: H5000M HNAT Fix (usb0) + AIQoS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: 'false'

      - name: Checkout local repo (for luci-app-aiqos overlay)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          for i in 1 2 3; do sudo apt update -y && break || sleep 10; done
          sudo apt-get clean
          sudo apt install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lld lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone ImmortalWrt source
        run: |
          git clone -b mt798x-mt799x-6.6-mtwifi --single-branch --filter=blob:none \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6 immortalwrt
          cd immortalwrt

          # 9996 and 9999 add unguarded HNAT code that references missing
          # mtk_hnat/ SDK symbols (NF_HNAT_SKB_CB2, MTK_FE_START_RESET etc.).
          # Remove them since the proprietary HNAT module source is unavailable.
          rm -f target/linux/mediatek/patches-6.6/9996-ext-hnat.patch
          rm -f target/linux/mediatek/patches-6.6/9999-reset.patch

          echo "=== Apply HNAT ext-devices usb0 patch ==="
          DTS_FILE=$(find target/linux/mediatek -name "*.dts" | xargs grep -l "hiveton\|h5000m\|H5000M" 2>/dev/null | head -1)
          if [ -z "$DTS_FILE" ]; then
            DTS_FILE=$(find target/linux/mediatek -name "mt7987*.dts" | xargs grep -l "hnat" 2>/dev/null | head -1)
          fi
          if [ -n "$DTS_FILE" ]; then
            echo "Found DTS: $DTS_FILE"
            if grep -q "hnat\s*{" "$DTS_FILE"; then
              sed -i '/hnat\s*{/a\\t\text-devices = "usb0";' "$DTS_FILE"
              echo "Added ext-devices = usb0"
            else
              echo '&hnat { ext-devices = "usb0"; };' >> "$DTS_FILE"
              echo "Created hnat node with ext-devices"
            fi
            grep -A3 "hnat" "$DTS_FILE" | head -6
          else
            echo "::warning::No DTS with hnat found, creating dtso"
            mkdir -p target/linux/mediatek/files-6.6/arch/arm64/boot/dts/mediatek
            printf '&hnat {\n\text-devices = "usb0";\n};' > target/linux/mediatek/files-6.6/arch/arm64/boot/dts/mediatek/mt7987-hnat-usb0.dtso
          fi

          echo "=== Add feeds ==="
          cat feeds.conf.default > feeds.conf
          echo "" >> feeds.conf
          echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -f -p qmodem

      - name: Configure build
        working-directory: immortalwrt
        run: |
          # Start with known H5000M config from auto-build project
          echo 'CONFIG_TARGET_mediatek=y' > .config
          echo 'CONFIG_TARGET_mediatek_filogic=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton_h5000m=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-sched-cake=y' >> .config
          echo 'CONFIG_PACKAGE_cake-autorate=y' >> .config
          echo 'CONFIG_PACKAGE_aiqosd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-aiqos=y' >> .config
          # make defconfig expands defaults; tolerate kconfig warnings from QModem feed
          make defconfig || true
          # QModem feed ndisc6/rdisc6 have self-select recursive kconfig bugs
          # that can drop the target device symbol. Force re-add if missing.
          if ! grep -q "hiveton_h5000m" .config; then
            echo "Target dropped, re-adding..."
            sed -i '/^CONFIG_TARGET_mediatek/d' .config
            echo 'CONFIG_TARGET_mediatek=y' >> .config
            echo 'CONFIG_TARGET_mediatek_filogic=y' >> .config
            echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton_h5000m=y' >> .config
          fi
          echo "=== Verify H5000M selected ==="
          grep "hiveton_h5000m" .config

      - name: Overlay local luci-app-aiqos (HNAT coexistence + bugfixes)
        working-directory: immortalwrt
        run: |
          echo "=== Removing feed version of luci-app-aiqos (from QModem) ==="
          rm -rf feeds/qmodem/luci-app-aiqos/ 2>/dev/null || true
          rm -rf feeds/luci/applications/luci-app-aiqos/ 2>/dev/null || true

          echo "=== Copying local luci-app-aiqos (v1.0.1 with HNAT coexistence + bugfixes) ==="
          cp -rf $GITHUB_WORKSPACE/package/luci-app-aiqos package/luci-app-aiqos
          cp -rf $GITHUB_WORKSPACE/package/luci-app-aiqos feeds/qmodem/luci-app-aiqos

          echo "=== Re-install feeds ==="
          ./scripts/feeds install -a -f -p qmodem 2>/dev/null || true
          ./scripts/feeds install luci-app-aiqos 2>/dev/null || true

          echo "=== Verify local package is used ==="
          ls -la package/luci-app-aiqos/Makefile
          ls -la feeds/qmodem/luci-app-aiqos/Makefile
          grep "VERSION" package/luci-app-aiqos/Makefile | head -1

      - name: Download sources
        working-directory: immortalwrt
        run: make download -j$(nproc) || echo "Some downloads failed, will retry during build"

      - name: Build firmware
        working-directory: immortalwrt
        run: make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Collect artifacts
        run: |
          mkdir -p release
          find immortalwrt/bin/targets/mediatek/filogic -name "*h5000m*sysupgrade*" -exec cp {} release/ \;
          find immortalwrt/bin/targets/mediatek/filogic -name "*h5000m*initramfs*" -exec cp {} release/ \;
          find immortalwrt/bin/targets/mediatek/filogic -name "*h5000m*.manifest" -exec cp {} release/ \;
          find immortalwrt/bin/targets/mediatek/filogic -name "sha256sums" -exec cp {} release/ \;
          ls -la release/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: h5000m-hnat-usb0-firmware
          path: release/
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: immortalwrt/build.log
          retention-days: 7
